name: "Create Google Analytics 4 deploy annotation"

on:
  push:
    branches:
      - main

jobs:
  create-annotations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install jsonwebtoken https

      - name: Create Teste1 Annotation
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          ANNOTATION_TITLE: "Teste1 - Mudança ecommerce"
        run: |
          node .github/scripts/create-annotation.js

      - name: Create Teste2 Annotation
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          ANNOTATION_TITLE: "Teste2 - Nova Campanha"
        run: |
          node .github/scripts/create-annotation.js
